name: 免费使用申请
description: 留下联系邮箱，空余名额开放后由我通过邮件发送用户号和密码。
title: '[使用申请] '
body:
  - type: markdown
    attributes:
      value: |
        阅座免费使用，服务器性能有限，最多开放 10 人。满额时需要等待。
        **Issue 和邮箱会公开显示，请使用愿意公开的联系邮箱。不要填写密码、Cookie、授权回跳链接或学号。**
  - type: input
    id: email
    attributes:
      label: 联系邮箱
      description: 用户号和密码将发到这个邮箱，请确认能够收信。
      placeholder: your-name@example.com
    validations:
      required: true
  - type: input
    id: school
    attributes:
      label: 学校名称（可选）
      description: 便于确认是否适配，只需学校名称，不需要学号或真实姓名。
  - type: textarea
    id: notes
    attributes:
      label: 补充说明（可选）
      description: 可以说明学校预约系统或希望使用的情况。
  - type: checkboxes
    id: confirmed
    attributes:
      label: 提交前确认
      options:
        - label: 我知道这条 Issue 和邮箱会公开显示，内容中没有密码、Cookie 或授权链接。
          required: true
        - label: 我已阅读仓库免责声明，会使用本人账号并遵守学校及图书馆规则。
          required: true
